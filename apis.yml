aid: fetch
name: Fetch
description: 'Fetch (formerly Fetch Rewards) is a consumer rewards and loyalty platform
  that lets shoppers earn points by scanning receipts and shopping at more than 600
  partner brands in-store and online, playing mobile games, and redeeming offers,
  then exchange those points for gift cards to retailers such as Amazon, Target, and
  Uber. Its Fetch for Business arm turns verified purchase data into full-funnel brand
  engagement, consumer spending insights, and campaign tooling (including the Fetch
  Ad Manager) for CPG, retail, restaurant, and agency partners. Fetch is a private,
  venture-backed company; it operates a consumer mobile app plus a Chrome extension
  and does not publish a public developer API.'
